  var TASK = {"cyr":"Бирламчи баҳолашда хатар ва ҳимояни аниқлаб, комплекс баҳолаш ўтказиб, индивидуал хизмат режаларини қўйинг.","lat":"Birlamchi baholashda xatar va himoyani aniqlab, kompleks baholash oʻtkazib, individual xizmat rejalarini qoʻying.","ru":"В ходе первичной оценки выявите риски и защитные факторы, проведите комплексную оценку и составьте индивидуальный план услуг."};
  var CASES = [{"id":"k1-mavluda","n":1,"title":{"lat":"Mavluda va oʻgʻli","cyr":"Мавлуда ва ўғли","ru":"Мавлуда и её сын"},"text":{"cyr":["Мавлуда 29 ёш, 7 ёшли ўғли билан маҳалланинг чекка қисмида ижарага олинган бир хонада яшайди. У яқинда турмуш ўртоғидан ажрашгач, бошқа ҳудудга кўчиб ўтган. Ҳозирда унинг доимий иш-жойи мавжуд эмас ва уйида вақти-вақти билан тикувчилик қилиб, оз миқдорда даромад топади. Сўнгги бир ой давомида унинг ўғли мактабнинг бир неча муддат қолдириб юборган. Қўшнилардан бири ижтимоий ходимга Мавлуда «ҳаёт қийинчиликларини яхши уддалай олмаяпти» ва «доим ёрдам сўраб юради» деб айтган.","Биринчи ташриф вақтида Мавлуда ўзини чарчаганини, ижара ҳақини тўлашдан хавотирда эканини ва яшаб турган хонасидан айрилиб қолишдан қўрқаётганини айтади.","Шунингдек, у ўғли тез-тез касал бўлиб туришини ва болага қарашда мунтазам ёрдам берадиган яқин кишиси йўқлигини маълум қилади.","У яна қайси нафақалар ёки хизматларга мурожаат қилиш ҳуқуқига эга эканини ҳар доим ҳам яхши тушунмаслигини айтади.","Шу билан бирга, Мавлуда хонани озода сақлайди, ўғлига меҳр билан муомала қилади ва унинг мактабда ўқишни давом эттиришини ҳамда «яхшироқ келажакка эга бўлишини» исташини таъкидлайди.","Суҳбат давомида ўғли онасига яқин юради. Аввалига у жим туради, кейинчалик эса мактабни яхши кўришини ва унга тез-тез боришни хоҳлашини айтади.","Мавлуда ёрдамни қабул қилишга тайёрлигини билдиради, аммо маҳалладаги одамлар уни «ёмон она» деб ўйлашларини истамаслигини ҳам қўшимча қилади."],"lat":["Mavluda 29 yosh, 7 yoshli oʻgʻli bilan mahallaning chekka qismida ijaraga olingan bir xonada yashaydi. U yaqinda turmush oʻrtogʻidan ajrashgach, boshqa hududga koʻchib oʻtgan. Hozirda uning doimiy ish-joyi mavjud emas va uyida vaqti-vaqti bilan tikuvchilik qilib, oz miqdorda daromad topadi. Soʻnggi bir oy davomida uning oʻgʻli maktabning bir necha muddat qoldirib yuborgan. Qoʻshnilardan biri ijtimoiy xodimga Mavluda «hayot qiyinchiliklarini yaxshi uddalay olmayapti» va «doim yordam soʻrab yuradi» deb aytgan.","Birinchi tashrif vaqtida Mavluda oʻzini charchaganini, ijara haqini toʻlashdan xavotirda ekanini va yashab turgan xonasidan ayrilib qolishdan qoʻrqayotganini aytadi.","Shuningdek, u oʻgʻli tez-tez kasal boʻlib turishini va bolaga qarashda muntazam yordam beradigan yaqin kishisi yoʻqligini maʼlum qiladi.","U yana qaysi nafaqalar yoki xizmatlarga murojaat qilish huquqiga ega ekanini har doim ham yaxshi tushunmasligini aytadi.","Shu bilan birga, Mavluda xonani ozoda saqlaydi, oʻgʻliga mehr bilan muomala qiladi va uning maktabda oʻqishni davom ettirishini hamda «yaxshiroq kelajakka ega boʻlishini» istashini taʼkidlaydi.","Suhbat davomida oʻgʻli onasiga yaqin yuradi. Avvaliga u jim turadi, keyinchalik esa maktabni yaxshi koʻrishini va unga tez-tez borishni xohlashini aytadi.","Mavluda yordamni qabul qilishga tayyorligini bildiradi, ammo mahalladagi odamlar uni «yomon ona» deb oʻylashlarini istamasligini ham qoʻshimcha qiladi."],"ru":["Мавлуде 29 лет. Вместе с 7-летним сыном она живёт в одной съёмной комнате на окраине махалли. Недавно, после развода с мужем, она переехала в другой район. Сейчас у неё нет постоянной работы: время от времени она шьёт на дому и получает небольшой доход. В течение последнего месяца её сын несколько раз пропускал школу. Один из соседей сказал социальному работнику, что Мавлуда «плохо справляется с жизненными трудностями» и «всё время просит о помощи».","Во время первого визита Мавлуда рассказывает, что устала, беспокоится об оплате аренды и боится лишиться комнаты, в которой живёт.","Она также сообщает, что сын часто болеет и что у неё нет близкого человека, который регулярно помогал бы ей присматривать за ребёнком.","Кроме того, она говорит, что не всегда хорошо понимает, на какие пособия или услуги имеет право претендовать.","При этом Мавлуда содержит комнату в чистоте, ласково обращается с сыном и подчёркивает, что хочет, чтобы он продолжал учиться в школе и «имел лучшее будущее».","Во время беседы сын держится рядом с матерью. Сначала он молчит, а потом говорит, что любит школу и хочет ходить туда чаще.","Мавлуда выражает готовность принять помощь, но добавляет, что не хочет, чтобы люди в махалле считали её «плохой матерью»."]}},{"id":"k2-ilhom-saida","n":2,"title":{"lat":"Ilhom va Saida oilasi","cyr":"Илҳом ва Саида оиласи","ru":"Семья Ильхома и Саиды"},"text":{"cyr":["Илҳом (38 ёш) ва Саида (34 ёш) турмуш қурганларига 15 йил бўлган. Уларнинг 4 нафар фарзанди бор: қизлари 14 ёшда, ўғиллари 9 ёшда, қизлари 6 ёшда ва кичик ўғли 4 ёшда.","Оила узоқ йиллар давомида бошқа вилоятда яшаган. Илҳом турли мавсумий ишлар билан шуғулланиб келган бўлса-да, даромади доимий эмас эди. Оила иқтисодий аҳволини яхшилаш мақсадида яшаб турган жойини сотиб, бошқа шаҳарнинг чекка қишлоғига кўчиб ўтишга қарор қилади. Улар бутун умр жамғарган маблағлари ҳисобига арзонроқ уй сотиб оладилар. Кўчиб ўтганларидан кейин кутилганидек иш топилмайди. Илҳом бир неча марта иш излаб кўради, аммо доимий бандликка эга бўла олмайди. Оиланинг захира маблағлари қисқа вақт ичида тугайди. Янги жойда оила рўйхатдан ўтмаганлиги сабабли давлат томонидан бериладиган айрим ижтимоий ёрдамлардан фойдалана олмайди. Болаларни мактаб ва боғчага жойлаштиришда ҳам муаммолар юзага келади. Ота-она рўйхатдан ўтиш учун талаб қилинадиган харажатларни ҳам, мактаб учун зарур кийим-кечак ва ўқув қуролларини ҳам сотиб олиш имкониятига эга эмас эдилар. Шу сабабли 14 ва 9 ёшли болалар бир неча ой давомида мактабга бормай қўядилар. 6 ёшли қиз мактабга тайёрлов гуруҳига қатнамайди, 4 ёшли бола эса боғчага жойлаштирилмайди.","Вақт ўтиши билан оиланинг иқтисодий аҳволи янада оғирлашади. Кундалик озиқ-овқат харид қилиш ҳам муаммога айланади. Ота-она болаларни қишлоқ атрофидан пластик идишлар, темир-терсак ва чиқиндилар йиғишга юбора бошлайдилар. Болалар йиғган чиқиндилар сотилиб, оз миқдорда бўлса ҳам оила даромадига ҳисса қўшар эди. 14 ёшли қиз уй ишлари ва кичик укаларини парвариш қилиш билан кўп вақт ўтказар, 9 ёшли ўғил эса деярли ҳар куни чиқинди йиғишга чиқарди. Болаларнинг бўш вақти, таълим олиши ва дам олиши учун имконият деярли қолмаган эди. Иқтисодий босим кучайган сари Илҳом тушкунликка тушиб боради. У ўзини оиласини таъминлай олмаётганидан айбдор ҳис қила бошлайди ва вақт ўтиши билан спиртли ичимлик истеъмол қилишни одат қилади. Маст ҳолатлари кўпайиб, оилада жанжаллар ҳам тез-тез кузатила бошлайди.","Саида эса қўшниларнинг уйларида мавсумий ишлар қилишга ҳаракат қилар, баъзан кир ювиш ёки тозалаш ишларидан озгина ҳақ оларди. Аммо бу маблағлар оиланинг эҳтиёжларини қоплаш учун етарли эмас эди. Қўшнилар болаларнинг мунтазам равишда чиқинди йиғиб юрганини, мактабга бормаётганини ва оиланинг оғир аҳволини кўриб, бу ҳақда маҳалла ва «Инсон» ижтимоий хизматлар марказига хабар берадилар."],"lat":["Ilhom (38 yosh) va Saida (34 yosh) turmush qurganlariga 15 yil boʻlgan. Ularning 4 nafar farzandi bor: qizlari 14 yoshda, oʻgʻillari 9 yoshda, qizlari 6 yoshda va kichik oʻgʻli 4 yoshda.","Oila uzoq yillar davomida boshqa viloyatda yashagan. Ilhom turli mavsumiy ishlar bilan shugʻullanib kelgan boʻlsa-da, daromadi doimiy emas edi. Oila iqtisodiy ahvolini yaxshilash maqsadida yashab turgan joyini sotib, boshqa shaharning chekka qishlogʻiga koʻchib oʻtishga qaror qiladi. Ular butun umr jamgʻargan mablagʻlari hisobiga arzonroq uy sotib oladilar. Koʻchib oʻtganlaridan keyin kutilganidek ish topilmaydi. Ilhom bir necha marta ish izlab koʻradi, ammo doimiy bandlikka ega boʻla olmaydi. Oilaning zaxira mablagʻlari qisqa vaqt ichida tugaydi. Yangi joyda oila roʻyxatdan oʻtmaganligi sababli davlat tomonidan beriladigan ayrim ijtimoiy yordamlardan foydalana olmaydi. Bolalarni maktab va bogʻchaga joylashtirishda ham muammolar yuzaga keladi. Ota-ona roʻyxatdan oʻtish uchun talab qilinadigan xarajatlarni ham, maktab uchun zarur kiyim-kechak va oʻquv qurollarini ham sotib olish imkoniyatiga ega emas edilar. Shu sababli 14 va 9 yoshli bolalar bir necha oy davomida maktabga bormay qoʻyadilar. 6 yoshli qiz maktabga tayyorlov guruhiga qatnamaydi, 4 yoshli bola esa bogʻchaga joylashtirilmaydi.","Vaqt oʻtishi bilan oilaning iqtisodiy ahvoli yanada ogʻirlashadi. Kundalik oziq-ovqat xarid qilish ham muammoga aylanadi. Ota-ona bolalarni qishloq atrofidan plastik idishlar, temir-tersak va chiqindilar yigʻishga yubora boshlaydilar. Bolalar yigʻgan chiqindilar sotilib, oz miqdorda boʻlsa ham oila daromadiga hissa qoʻshar edi. 14 yoshli qiz uy ishlari va kichik ukalarini parvarish qilish bilan koʻp vaqt oʻtkazar, 9 yoshli oʻgʻil esa deyarli har kuni chiqindi yigʻishga chiqardi. Bolalarning boʻsh vaqti, taʼlim olishi va dam olishi uchun imkoniyat deyarli qolmagan edi. Iqtisodiy bosim kuchaygan sari Ilhom tushkunlikka tushib boradi. U oʻzini oilasini taʼminlay olmayotganidan aybdor his qila boshlaydi va vaqt oʻtishi bilan spirtli ichimlik isteʼmol qilishni odat qiladi. Mast holatlari koʻpayib, oilada janjallar ham tez-tez kuzatila boshlaydi.","Saida esa qoʻshnilarning uylarida mavsumiy ishlar qilishga harakat qilar, baʼzan kir yuvish yoki tozalash ishlaridan ozgina haq olardi. Ammo bu mablagʻlar oilaning ehtiyojlarini qoplash uchun yetarli emas edi. Qoʻshnilar bolalarning muntazam ravishda chiqindi yigʻib yurganini, maktabga bormayotganini va oilaning ogʻir ahvolini koʻrib, bu haqda mahalla va «Inson» ijtimoiy xizmatlar markaziga xabar beradilar."],"ru":["Ильхом (38 лет) и Саида (34 года) состоят в браке 15 лет. У них четверо детей: дочери 14 лет, сыну 9 лет, дочери 6 лет и младшему сыну 4 года.","Много лет семья жила в другой области. Ильхом занимался разными сезонными работами, но постоянного дохода у него не было. Чтобы улучшить материальное положение, семья решает продать жильё и переехать в отдалённое село на окраине другого города. На все сбережения, накопленные за жизнь, они покупают более дешёвый дом. После переезда работу, вопреки ожиданиям, найти не удаётся. Ильхом несколько раз пытается устроиться, но постоянной занятости так и не получает. Сбережения семьи быстро заканчиваются. Поскольку на новом месте семья не прошла регистрацию, она не может пользоваться некоторыми видами государственной социальной помощи. Возникают проблемы и с устройством детей в школу и детский сад. Родители не могут оплатить ни расходы, необходимые для регистрации, ни школьную одежду и учебные принадлежности. Поэтому дети 14 и 9 лет несколько месяцев не ходят в школу. 6-летняя дочь не посещает подготовительную к школе группу, а 4-летний ребёнок не устроен в детский сад.","Со временем материальное положение семьи ещё больше ухудшается. Проблемой становится даже покупка повседневных продуктов. Родители начинают отправлять детей собирать в окрестностях села пластиковую тару, металлолом и мусор. Собранное детьми продавалось, и это хоть немного пополняло семейный доход. 14-летняя дочь много времени проводила за домашними делами и уходом за младшими, а 9-летний сын почти каждый день уходил собирать отходы. На свободное время, учёбу и отдых у детей почти не оставалось возможностей. По мере усиления финансового давления Ильхом всё больше впадает в уныние. Он начинает винить себя за то, что не может обеспечить семью, и со временем привыкает употреблять алкоголь. Он всё чаще бывает пьян, в семье участились ссоры.","Саида старается подрабатывать сезонными работами в домах соседей, иногда получая немного денег за стирку или уборку. Однако этих средств недостаточно, чтобы покрыть нужды семьи. Соседи, видя, что дети регулярно собирают мусор, не ходят в школу и что семья в тяжёлом положении, сообщают об этом в махаллю и в центр социальных услуг «Инсон»."]}},{"id":"k3-jasur","n":3,"title":{"lat":"Jasur","cyr":"Жасур","ru":"Жасур"},"text":{"cyr":["Нигора туман «Инсон» ижтимоий хизматлар марказида кейс-менежер сифатида ишлайди. У 10 ёшли Жасур билан сўнгги 8 ой давомида ишлаб келмоқда. Жасурнинг онаси оғир касалликдан кейин вафот этган. Онасининг вафотидан кўп ўтмай, отаси оғир жиноят содир этганлиги учун озодликдан маҳрум қилиниб, жазони ижро этиш муассасасига юборилган. Шу тариқа Жасур ота-она қарамоғисиз қолган.","Дастлаб болани қариндошлари қарамоғига бериш масаласи кўриб чиқилган. Бироқ ўша пайтда холаси бошқа шаҳарда яшагани, иқтисодий аҳволи яхши эмаслиги ва оиласида бир нечта фарзандлари борлиги сабабли Жасур вақтинчалик оилавий болалар уйига жойлаштирилган.","Жасур оилавий болалар уйига келган дастлабки ойларда жуда оғир эмоционал ҳолатни бошдан кечирган. У кўп йиғлар, онасини соғинар, кечалари ёмон тушлар кўриб уйғонар ва атрофдагилар билан мулоқот қилишдан қочар эди. Мактабда ҳам баъзан жанжаллашиб қолар, ўқитувчилар уни жиззаки ва асабий деб таърифлашарди.","Нигора бола билан мунтазам иш олиб борди. Суҳбатлар, кузатувлар ва баҳолаш жараёнлари давомида у Жасурнинг энг катта эҳтиёжи ўзини бирор оилага тегишли ҳис қилиш эканлигини аниқлади. Жасур ҳар сафар холаси ҳақида гап кетганда илиқ муносабат билдирар, таътил кунлари унинг уйига борганда ўзини анча хотиржам ҳис қилишини айтарди. Сўнгги ойларда холаси ҳам бир неча марта Жасурни ўз қарамоғига олиш истагини билдирган. Баҳолаш жараёнида маълум бўлишича, хола ва унинг турмуш ўртоғи болага нисбатан меҳрибон муносабатда, Жасур уларнинг фарзандлари билан ҳам яхши чиқишади. Хола Жасурни мактабга жойлаштириш ва парвариш қилишга тайёрлигини билдирган.","Шу билан бирга, Жасурда ҳали ҳам баъзи муаммолар сақланиб қолган эди. Масалан, у баъзан қаттиқ асабийлашиб кетар, тенгдошлари билан низога киришар, айрим ҳолларда катталар талабларига бўйсунмаслик ҳолатлари кузатиларди. Мутахассислар бу ҳолатларни унинг ҳаётидаги оғир йўқотишлар ва травматик воқеалар билан боғлашарди.","Жасурнинг кейинги тақдири муҳокама қилинаётган йиғилишда турли мутахассислар иштирок этди. Улар орасида вояга етмаганлар билан ишлаш бўйича мутахассис Элдор ҳам бор эди. Нигора Жасурни холаси қарамоғига васийликка бериш тарафдори бўлиб чиқди. У боланинг оила муҳитига эҳтиёжи юқори эканлигини, холаси билан эмоционал алоқаси яхши шаклланганлигини ва бу боланинг барқарор ривожланиши учун муҳимлигини таъкидлади. Бироқ Элдор бошқача фикр билдирди. Унинг фикрича, Жасурда ҳали ҳам хулқ-атвор билан боғлиқ муаммолар сақланиб қолган. Шу сабабли у болани яна бир неча йил реабилитация муассасаси ёки махсус турар-жой муассасасида қолдириш мақсадга мувофиқ деб ҳисоблади. Бу фикр Нигорани қаттиқ ҳайратга солди. Унинг назарида, бола аллақачон оиласизлик оқибатларини бошдан кечирган ва уни яна муассасада қолдириш боланинг манфаатларига зид эди.","Муҳокама давомида баҳс тобора кескинлашиб борди. Нигора боланинг ҳуқуқлари ва энг яхши манфаатларини ҳимоя қилишга ҳаракат қилди. Элдор эса хавфсизлик ва хулқ-атвор билан боғлиқ муаммоларни биринчи ўринга қўйди. Оқибатда икки мутахассис ўртасидаги баҳс эмоционал тус олди. Овозлар кўтарилди, йиғилиш муҳити таранглашди. Нигора жуда ҳаяжонланган ҳолатга келиб қолгани сабабли раҳбар томонидан бироз тинчланиши учун йиғилиш залидан чиқарилди. Йиғилиш эса Жасурнинг кейинги тақдири ҳақида якуний қарор қабул қилмасдан тугади."],"lat":["Nigora tuman «Inson» ijtimoiy xizmatlar markazida keys-menejer sifatida ishlaydi. U 10 yoshli Jasur bilan soʻnggi 8 oy davomida ishlab kelmoqda. Jasurning onasi ogʻir kasallikdan keyin vafot etgan. Onasining vafotidan koʻp oʻtmay, otasi ogʻir jinoyat sodir etganligi uchun ozodlikdan mahrum qilinib, jazoni ijro etish muassasasiga yuborilgan. Shu tariqa Jasur ota-ona qaramogʻisiz qolgan.","Dastlab bolani qarindoshlari qaramogʻiga berish masalasi koʻrib chiqilgan. Biroq oʻsha paytda xolasi boshqa shaharda yashagani, iqtisodiy ahvoli yaxshi emasligi va oilasida bir nechta farzandlari borligi sababli Jasur vaqtinchalik oilaviy bolalar uyiga joylashtirilgan.","Jasur oilaviy bolalar uyiga kelgan dastlabki oylarda juda ogʻir emotsional holatni boshdan kechirgan. U koʻp yigʻlar, onasini sogʻinar, kechalari yomon tushlar koʻrib uygʻonar va atrofdagilar bilan muloqot qilishdan qochar edi. Maktabda ham baʼzan janjallashib qolar, oʻqituvchilar uni jizzaki va asabiy deb taʼriflashardi.","Nigora bola bilan muntazam ish olib bordi. Suhbatlar, kuzatuvlar va baholash jarayonlari davomida u Jasurning eng katta ehtiyoji oʻzini biror oilaga tegishli his qilish ekanligini aniqladi. Jasur har safar xolasi haqida gap ketganda iliq munosabat bildirar, taʼtil kunlari uning uyiga borganda oʻzini ancha xotirjam his qilishini aytardi. Soʻnggi oylarda xolasi ham bir necha marta Jasurni oʻz qaramogʻiga olish istagini bildirgan. Baholash jarayonida maʼlum boʻlishicha, xola va uning turmush oʻrtogʻi bolaga nisbatan mehribon munosabatda, Jasur ularning farzandlari bilan ham yaxshi chiqishadi. Xola Jasurni maktabga joylashtirish va parvarish qilishga tayyorligini bildirgan.","Shu bilan birga, Jasurda hali ham baʼzi muammolar saqlanib qolgan edi. Masalan, u baʼzan qattiq asabiylashib ketar, tengdoshlari bilan nizoga kirishar, ayrim hollarda kattalar talablariga boʻysunmaslik holatlari kuzatilardi. Mutaxassislar bu holatlarni uning hayotidagi ogʻir yoʻqotishlar va travmatik voqealar bilan bogʻlashardi.","Jasurning keyingi taqdiri muhokama qilinayotgan yigʻilishda turli mutaxassislar ishtirok etdi. Ular orasida voyaga yetmaganlar bilan ishlash boʻyicha mutaxassis Eldor ham bor edi. Nigora Jasurni xolasi qaramogʻiga vasiylikka berish tarafdori boʻlib chiqdi. U bolaning oila muhitiga ehtiyoji yuqori ekanligini, xolasi bilan emotsional aloqasi yaxshi shakllanganligini va bu bolaning barqaror rivojlanishi uchun muhimligini taʼkidladi. Biroq Eldor boshqacha fikr bildirdi. Uning fikricha, Jasurda hali ham xulq-atvor bilan bogʻliq muammolar saqlanib qolgan. Shu sababli u bolani yana bir necha yil reabilitatsiya muassasasi yoki maxsus turar-joy muassasasida qoldirish maqsadga muvofiq deb hisobladi. Bu fikr Nigorani qattiq hayratga soldi. Uning nazarida, bola allaqachon oilasizlik oqibatlarini boshdan kechirgan va uni yana muassasada qoldirish bolaning manfaatlariga zid edi.","Muhokama davomida bahs tobora keskinlashib bordi. Nigora bolaning huquqlari va eng yaxshi manfaatlarini himoya qilishga harakat qildi. Eldor esa xavfsizlik va xulq-atvor bilan bogʻliq muammolarni birinchi oʻringa qoʻydi. Oqibatda ikki mutaxassis oʻrtasidagi bahs emotsional tus oldi. Ovozlar koʻtarildi, yigʻilish muhiti taranglashdi. Nigora juda hayajonlangan holatga kelib qolgani sababli rahbar tomonidan biroz tinchlanishi uchun yigʻilish zalidan chiqarildi. Yigʻilish esa Jasurning keyingi taqdiri haqida yakuniy qaror qabul qilmasdan tugadi."],"ru":["Нигора работает кейс-менеджером в районном центре социальных услуг «Инсон». Последние 8 месяцев она работает с 10-летним Жасуром. Мать Жасура умерла после тяжёлой болезни. Вскоре после её смерти отец за совершение тяжкого преступления был лишён свободы и направлен в учреждение исполнения наказаний. Так Жасур остался без попечения родителей.","Сначала рассматривался вопрос о передаче ребёнка под опеку родственников. Однако в то время его тётя (сестра матери) жила в другом городе, её материальное положение было непростым, а в её семье было несколько детей. Поэтому Жасура временно поместили в семейный детский дом.","В первые месяцы в семейном детском доме Жасур переживал очень тяжёлое эмоциональное состояние. Он много плакал, тосковал по матери, по ночам просыпался от кошмаров и избегал общения с окружающими. В школе он тоже иногда ввязывался в ссоры; учителя описывали его как вспыльчивого и нервного.","Нигора регулярно работала с ребёнком. В ходе бесед, наблюдений и оценки она выяснила, что главная потребность Жасура — чувствовать, что он принадлежит какой-то семье. Каждый раз, когда речь заходила о тёте, Жасур отзывался о ней тепло и говорил, что, когда на каникулах бывает у неё дома, чувствует себя гораздо спокойнее. В последние месяцы тётя тоже несколько раз выражала желание взять Жасура к себе. В ходе оценки выяснилось, что тётя и её муж относятся к мальчику доброжелательно, а Жасур хорошо ладит с их детьми. Тётя выразила готовность устроить Жасура в школу и заботиться о нём.","Вместе с тем у Жасура всё ещё сохранялись некоторые проблемы. Например, иногда он сильно раздражался, вступал в конфликты со сверстниками, в отдельных случаях не подчинялся требованиям взрослых. Специалисты связывали это с тяжёлыми потерями и травмирующими событиями в его жизни.","В совещании, на котором обсуждалась дальнейшая судьба Жасура, участвовали разные специалисты, среди них — специалист по работе с несовершеннолетними Элдор. Нигора выступила за передачу Жасура под опеку тёти. Она подчеркнула, что потребность мальчика в семейном окружении высока, что у него сложилась хорошая эмоциональная связь с тётей и что это важно для его устойчивого развития. Однако Элдор высказал другое мнение. По его словам, у Жасура всё ещё сохраняются проблемы с поведением, поэтому целесообразно оставить его ещё на несколько лет в реабилитационном или специализированном учреждении с проживанием. Это мнение сильно удивило Нигору. По её мнению, мальчик уже пережил последствия жизни без семьи, и снова оставлять его в учреждении — против его интересов.","В ходе обсуждения спор всё больше обострялся. Нигора старалась защитить права и наилучшие интересы ребёнка. Элдор же ставил на первое место вопросы безопасности и поведения. В итоге спор между двумя специалистами принял эмоциональный характер. Голоса повысились, атмосфера совещания накалилась. Поскольку Нигора была очень взволнована, руководитель попросил её выйти из зала, чтобы немного успокоиться. Совещание завершилось, так и не приняв окончательного решения о дальнейшей судьбе Жасура."]}}];
  function t(key, vars) {
    var dict = T[S.lang] || T.lat;
    var s = dict[key];
    if (s == null) s = T.lat[key];
    if (s == null) s = key;
    if (vars) Object.keys(vars).forEach(function (k) { s = String(s).split("{" + k + "}").join(vars[k]); });
    return s;
  }
  function regionName(id) { return (T[S.lang].regions[id]) || "—"; }
  var DIST_IDX = {};
  Object.keys(DISTRICTS).forEach(function (r) { DISTRICTS[r].forEach(function (d) { DIST_IDX[d[0]] = { region: r, lat: d[1], cyr: d[2], ru: d[3] }; }); });
  function districtName(id) { var d = DIST_IDX[id]; return d ? (d[S.lang] || d.lat) : ""; }
  function districtOk(region, id) { var d = DIST_IDX[id]; return !!d && d.region === region; }
  function fillDistricts(sel, region, placeholder, allLabel) {
    if (!sel) return;
    var cur = sel.value;
    var list = DISTRICTS[region] || [];
    var col = { lat: 1, cyr: 2, ru: 3 }[S.lang] || 1;
    var loc = { lat: "uz", cyr: "uz-Cyrl", ru: "ru" }[S.lang];
    var html = allLabel != null
      ? '<option value="">' + esc(allLabel) + "</option>"
      : '<option value="" disabled>' + esc(region ? placeholder : t("districtPh0")) + "</option>";
    [[0, t("grpTuman")], [1, t("grpShahar")]].forEach(function (g) {
      var items = list.filter(function (d) { return d[4] === g[0]; }).sort(function (a, b) { return a[col].localeCompare(b[col], loc); });
      if (!items.length) return;
      html += '<optgroup label="' + esc(g[1]) + '">' + items.map(function (d) { return '<option value="' + esc(d[0]) + '">' + esc(d[col]) + "</option>"; }).join("") + "</optgroup>";
    });
    sel.innerHTML = html;
    sel.disabled = !region;
    sel.value = list.some(function (d) { return d[0] === cur; }) ? cur : "";
    if (allLabel == null && !sel.value) sel.selectedIndex = 0;
  }
  function roleName(id) { return (T[S.lang].roles[id]) || "—"; }
  function roleShort(id) { var d = T[S.lang].rolesShort || {}; return d[id] || roleName(id); }
  function fillSelect(sel, ids, names, placeholder, allLabel) {
    var cur = sel.value;
    var html = placeholder != null ? '<option value="" disabled>' + esc(placeholder) + "</option>" : '<option value="">' + esc(allLabel) + "</option>";
    ids.forEach(function (id) { html += '<option value="' + esc(id) + '">' + esc(names[id]) + "</option>"; });
    sel.innerHTML = html;
    sel.value = cur || "";
    if (placeholder != null && !cur) sel.selectedIndex = 0;
  }
  function setLang(l) { if (!T[l]) return; S.lang = l; store.set("ihma-lang", l); applyLang(); }
  function effTheme() {
    var a = document.documentElement.getAttribute("data-theme");
    if (a === "dark" || a === "light") return a;
    return darkMQ && darkMQ.matches ? "dark" : "light";
  }
  function updateThemeBtn() {
    var dark = effTheme() === "dark";
    $("#theme-moon").toggleAttribute("hidden", dark);
    $("#theme-sun").toggleAttribute("hidden", !dark);
    var label = dark ? t("themeLight") : t("themeDark");
    $("#theme-btn").setAttribute("aria-label", label);
    $("#theme-btn").setAttribute("title", label);
  }
  function toggleTheme() {
    var next = effTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    store.set("ihma-theme", next);
    updateThemeBtn();
  }
  var darkMQ = null;
  try { darkMQ = window.matchMedia("(prefers-color-scheme: dark)"); } catch (e) {}
  (function initTheme() {
    var saved = store.get("ihma-theme");
    if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    if (darkMQ) {
      var h = function () { updateThemeBtn(); };
      if (darkMQ.addEventListener) darkMQ.addEventListener("change", h); else if (darkMQ.addListener) darkMQ.addListener(h);
    }
  })();
  var FS_STEPS = [0.875, 1, 1.125, 1.25, 1.375];
  var fsIdx = FS_STEPS.indexOf(Number(store.get("ihma-fs")));
  if (fsIdx < 0) fsIdx = 1;
  function applyFs() {
    document.documentElement.style.setProperty("--fs-scale", String(FS_STEPS[fsIdx]));
    var pct = Math.round(FS_STEPS[fsIdx] * 100) + "%";
    [["#fs-dec", "fsDec"], ["#fs-inc", "fsInc"]].forEach(function (p) {
      var label = t(p[1]) + " · " + pct;
      $(p[0]).setAttribute("aria-label", label);
      $(p[0]).setAttribute("title", label);
    });
    $("#fs-dec").disabled = fsIdx === 0;
    $("#fs-inc").disabled = fsIdx === FS_STEPS.length - 1;
    store.set("ihma-fs", FS_STEPS[fsIdx]);
  }
  function validate() {
    var fio = $("#fio").value.trim();
    var okFio = fio.split(/\s+/).filter(Boolean).length >= 2;
    var okReg = !!$("#region").value;
    var okDist = districtOk($("#region").value, $("#district").value);
    var okRole = !!$("#role").value;
    [["#f-fio", okFio], ["#f-region", okReg], ["#f-district", !okReg || okDist], ["#f-role", okRole]].forEach(function (p) {
      var f = $(p[0]);
      f.classList.toggle("invalid", !p[1]);
      $(".field-err", f).hidden = p[1];
    });
    if (!okFio) $("#fio").focus(); else if (!okReg) $("#region").focus(); else if (!okDist) $("#district").focus(); else if (!okRole) $("#role").focus();
    return okFio && okReg && okDist && okRole;
  }
  function setPane(p) {
    $("#grid-case").setAttribute("data-pane", p);
    $("#pane-btn-case").setAttribute("aria-selected", String(p === "case"));
    $("#pane-btn-answer").setAttribute("aria-selected", String(p === "answer"));
  }
  function renderWho() {
    var a = S.attempt;
    $("#case-who").textContent = a ? [a.fio, regionName(a.region), districtName(a.district), roleName(a.role)].filter(Boolean).join(" · ") : "";
  }
  function getCase(id) { for (var i = 0; i < CASES.length; i++) { if (CASES[i].id === id) return CASES[i]; } return null; }
  function caseNo(id) { var c = getCase(id); return c ? "№" + c.n : "—"; }
  function caseLabel(id) { var c = getCase(id); return c ? "№" + c.n + " · " + (c.title[S.lang] || c.title.lat) : "—"; }
  function renderCaseText() {
    var c = S.attempt ? getCase(S.attempt.caseId) : null;
    if (!c) { $("#case-eyebrow").textContent = ""; $("#case-text").innerHTML = ""; $("#case-task").textContent = ""; return; }
    $("#case-eyebrow").textContent = t("caseEyebrow", { n: c.n, title: c.title[S.lang] || c.title.lat });
    $("#case-text").innerHTML = (c.text[S.lang] || c.text.cyr).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
    $("#case-task").textContent = TASK[S.lang] || TASK.cyr;
  }
  function updateCounter() {
    var v = $("#answer").value;
    $("#counter").textContent = t("counter", { n: v.length, w: words(v) });
    $("#pane-count").textContent = words(v) ? "· " + words(v) : "";
    $("#submit-btn").disabled = !v.trim();
  }
  function scoreClass(total, max) { var p = max ? total / max : 0; return p >= .75 ? "ok" : (p >= .45 ? "warn" : "bad"); }
  function cleanClass(c) { return c == null ? "info" : (c >= 80 ? "ok" : (c >= 50 ? "warn" : "bad")); }
  function resultBlocks(att, split) {
    var r = att.result;
    if (!r) return split ? null : "";
    var pct = Math.round((r.total / r.max) * 100);
    var names = T[S.lang].crit;
    var score =
      '<div class="card raised stack-16">' +
        '<div class="score-card">' +
          '<span class="medal">' + ICON.medal + "</span>" +
          '<div class="stack-8">' +
            '<span class="eyebrow">' + esc(t("judgeTitle")) + "</span>" +
            '<div class="score-line"><span class="score-big">' + fmtNum(r.total) + '</span><span class="score-max">/ ' + r.max + "</span>" +
            '<span class="badge ' + scoreClass(r.total, r.max) + ' num">' + pct + "%</span></div>" +
            '<div class="meter" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
          "</div>" +
          (r.summary ? '<p class="score-summary">' + esc(r.summary) + "</p>" : "") +
        "</div>" +
      "</div>";
    var crit =
      '<div class="card raised stack-16">' +
        '<h2 class="row">' + ICON.doc + "<span>" + esc(t("expertTitle")) + "</span></h2>" +
        r.criteria.map(function (c) {
          var aw = c.awarded.length ? c.awarded.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") : "<li>—</li>";
          var de = c.deducted.length ? c.deducted.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") : "<li>—</li>";
          return '<section class="crit">' +
            '<div class="crit-head"><h3><span>[' + c.n + "]</span>" + esc(names[c.n - 1]) + '</h3><span class="badge ' + scoreClass(c.score, c.max) + ' num">' + fmtNum(c.score) + " / " + c.max + "</span></div>" +
            '<div class="crit-cols">' +
              '<div class="reasons plus"><span class="r-title">' + ICON.check + esc(t("awarded")) + "</span><ul>" + aw + "</ul></div>" +
              '<div class="reasons minus"><span class="r-title">' + ICON.minus + esc(t("deducted")) + "</span><ul>" + de + "</ul></div>" +
            "</div></section>";
        }).join("") +
      "</div>";
    var ind = r.independence || {};
    var cleanTxt = ind.clean == null ? t("indepNA") : ind.clean + "% " + t("cleanWord");
    var indep =
      '<div class="card raised"><div class="indep">' +
        '<div class="row between"><h2 class="row">' + ICON.shield + "<span>" + esc(t("indepTitle")) + "</span></h2>" +
        '<span class="badge ' + cleanClass(ind.clean) + ' num">' + esc(cleanTxt) + "</span></div>" +
        (ind.verdict ? "<p><b>" + esc(ind.verdict) + "</b></p>" : "") +
        (ind.notes && ind.notes.length ? '<ul class="reasons"><li>' + ind.notes.map(esc).join("</li><li>") + "</li></ul>" : "") +
        '<p class="cap muted">' + esc(t("indepCaveat")) + "</p>" +
      "</div></div>";
    if (split) return { score: score, crit: crit, indep: indep };
    return score + crit + indep;
  }
  function metaBlock(att) {
    return '<dl class="meta">' +
      "<div><dt>" + esc(t("metaFio")) + "</dt><dd>" + esc(att.fio) + "</dd></div>" +
      "<div><dt>" + esc(t("metaRegion")) + "</dt><dd>" + esc(regionName(att.region)) + "</dd></div>" +
      (att.district ? "<div><dt>" + esc(t("metaDistrict")) + "</dt><dd>" + esc(districtName(att.district)) + "</dd></div>" : "") +
      "<div><dt>" + esc(t("metaRole")) + "</dt><dd>" + esc(roleName(att.role)) + "</dd></div>" +
      "<div><dt>" + esc(t("txtCase")) + "</dt><dd>" + esc(caseLabel(att.caseId)) + "</dd></div>" +
      "<div><dt>" + esc(t("metaDate")) + '</dt><dd class="num">' + esc(fmtDate(att.submittedAt || att.startedAt)) + "</dd></div>" +
      "</dl>";
  }
  function resultText(att) {
    var r = att.result;
    if (!r) return "";
    var names = T[S.lang].crit;
    var lines = [
      "ISTC · " + t("brandSub"),
      t("metaFio") + ": " + att.fio,
      t("metaRegion") + ": " + regionName(att.region),
      t("metaDistrict") + ": " + (districtName(att.district) || "—"),
      t("metaRole") + ": " + roleName(att.role),
      t("txtCase") + ": " + caseLabel(att.caseId),
      t("metaDate") + ": " + fmtDate(att.submittedAt || att.startedAt),
      "",
      "🏅 " + t("judgeTitle") + ": " + fmtNum(r.total) + " / " + r.max,
      "📝 " + t("expertTitle") + ":"
    ];
    r.criteria.forEach(function (c) {
      lines.push("[" + c.n + "] " + names[c.n - 1] + " (" + fmtNum(c.score) + " / " + c.max + "):");
      lines.push("   - " + t("awarded") + ": " + (c.awarded.join("; ") || "—"));
      lines.push("   - " + t("deducted") + ": " + (c.deducted.join("; ") || "—"));
    });
    var ind = r.independence || {};
    lines.push("🕵️‍♂️ " + t("indepTitle") + ": " + (ind.clean == null ? t("indepNA") : ind.clean + "% " + t("cleanWord")) + (ind.verdict ? " (" + ind.verdict + ")" : ""));
    (ind.notes || []).forEach(function (n) { lines.push("   - " + n); });
    if (r.summary) { lines.push(""); lines.push(r.summary); }
    return lines.join("\n");
  }
  function statusBadge(a) {
    if (a.status === "done") return '<span class="badge ok">' + esc(t("stDone")) + "</span>";
    if (a.status === "error") return '<span class="badge bad">' + esc(t("stError")) + "</span>";
    return '<span class="badge info">' + esc(t("stPending")) + "</span>";
  }
  function sortAtts(list) {
    return list.slice().sort(function (x, y) { return String(y.submittedAt || y.startedAt || "").localeCompare(String(x.submittedAt || x.startedAt || "")); });
  }

  /* ================= Telegram Mini App: holat va server bilan aloqa ================= */
  /* Bir sahifa — bir nechta bot: har bot o'z backend'i (jadvali) bilan ishlaydi.
     Bot menyusi "?b=istc" bilan ochadi, natija tugmasi esa istc/ orqali shu yerga "b=istc" ni olib keladi. Kalit bo'lmasa — ihma. */
  var BOTS = {
    ihma: { api: "https://script.google.com/macros/s/AKfycbxQaXlH7lsNzYyP1KlNQPo8XoGg4LZfzF4qhJQGt5XvDd12n0LfUoP3o47yDE_wesmrRw/exec", link: "https://t.me/ihma_baholash_bot" },
    istc: { api: "https://script.google.com/macros/s/AKfycbyv9vNnDFYTqwRx82X1xY-sBN4cvws_H7Wq4P86HucN92jrS1onGOa-QjvrB7eBRq1Cgg/exec", link: "https://t.me/istc_baholash_bot" }
  };
  var BOT_KEY = "ihma";
  try { var bq = new URLSearchParams(location.search).get("b"); if (bq && BOTS[bq]) BOT_KEY = bq; } catch (e) {}
  var API_URL = BOTS[BOT_KEY].api;
  var BOT_LINK = BOTS[BOT_KEY].link;
  var TG = (window.Telegram && window.Telegram.WebApp) || null;
  var HAS_TG = !!(TG && TG.initData);
  var CONFIGURED = /^https:\/\//.test(API_URL) || /^http:\/\/localhost[:/]/.test(API_URL);
  if (BOT_LINK.indexOf("@@") === 0) BOT_LINK = "";

  /* Standart til — o'zbek (lotin). Xodim boshqa tilni tanlasa, tanlovi eslab qolinadi. */
  var S = {
    lang: (store.get("ihma-lang") in T) ? store.get("ihma-lang") : "lat",
    flow: "start", view: "test", ready: false, initError: null, attempt: null, tick: null,
    submitting: false, starting: false, history: [], viewing: null, resultFrom: "flow",
    poll: null, skew: 0, waitId: null, sentAt: null, sendError: null, autoSent: false
  };

  function api(action, payload) {
    if (!CONFIGURED) return Promise.reject({ code: "config" });
    var body = Object.assign({ action: action, initData: TG ? TG.initData : "" }, payload || {});
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 30000);
    /* text/plain — brauzer qo'shimcha (preflight) so'rov yubormaydi, Apps Script shuni qabul qiladi */
    return fetch(API_URL, { method: "POST", body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined, redirect: "follow" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(timer);
        if (j && j.serverNow) S.skew = j.serverNow - Date.now();
        if (!j || !j.ok) throw { code: (j && j.error) || "server" };
        return j;
      }, function () { clearTimeout(timer); throw { code: "network" }; });
  }
  function now() { return Date.now() + S.skew; }
  function mapStatus(s) { return s === "baholandi" ? "done" : (s === "xato" ? "error" : (s === "boshlandi" ? "started" : "pending")); }
  function fromServer(x) {
    return {
      id: x.id, caseId: x.caseId, fio: x.fio, region: x.region, district: x.district, role: x.role, lang: x.lang,
      startedAt: x.startedAt, submittedAt: x.submittedAt, status: mapStatus(x.status), timing: x.timing,
      result: x.result || null
    };
  }
  function fromShort(x) {
    return { id: x.id, caseId: x.caseId, status: mapStatus(x.status), total: x.total, max: x.max, startedAt: x.startedAt, submittedAt: x.submittedAt };
  }

  /* ---------- qoralama: Telegram bulut xotirasi (+ shu qurilma xotirasi) ---------- */
  var cloud = {
    ok: !!(TG && TG.CloudStorage && (!TG.isVersionAtLeast || TG.isVersionAtLeast("6.9"))),
    get: function (keys) {
      return new Promise(function (res) {
        if (!cloud.ok) return res({});
        try { TG.CloudStorage.getItems(keys, function (err, vals) { res(err ? {} : (vals || {})); }); } catch (e) { res({}); }
      });
    },
    set: function (k, v) {
      if (!cloud.ok) return;
      try { TG.CloudStorage.setItem(k, v, function () {}); } catch (e) {}
    },
    del: function (keys) {
      if (!cloud.ok) return;
      try { TG.CloudStorage.removeItems(keys, function () {}); } catch (e) {}
    }
  };
  var CHUNK = 3800, NCHUNK = 3;
  function draftKeys(id) {
    var base = "d_" + String(id).replace(/[^A-Za-z0-9_-]/g, "");
    var k = [];
    for (var i = 0; i < NCHUNK; i++) k.push(base + "_" + i);
    return k;
  }
  function saveDraft() {
    var a = S.attempt;
    if (!a) return;
    var txt = String(a.answer || "");
    store.set("ihma-tgdraft", { id: a.id, answer: txt });
    draftKeys(a.id).forEach(function (k, i) { cloud.set(k, txt.slice(i * CHUNK, (i + 1) * CHUNK)); });
  }
  function loadDraft(id) {
    var local = store.get("ihma-tgdraft");
    var localTxt = local && local.id === id ? String(local.answer || "") : "";
    var keys = draftKeys(id);
    return cloud.get(keys).then(function (vals) {
      var c = keys.map(function (k) { return vals[k] || ""; }).join("");
      return c.length >= localTxt.length ? c : localTxt;
    });
  }
  function clearDraft(id) {
    store.del("ihma-tgdraft");
    cloud.del(draftKeys(id));
  }

  /* ---------- til ---------- */
  function applyLang() {
    document.documentElement.lang = { lat: "uz-Latn", cyr: "uz-Cyrl", ru: "ru" }[S.lang];
    $$("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    $$("[data-i18n-ph]").forEach(function (el) { el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
    $$("[data-i18n-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
    $$("[data-i18n-title]").forEach(function (el) { el.setAttribute("title", t(el.getAttribute("data-i18n-title"))); });
    $$(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === S.lang)); });
    updateThemeBtn();
    applyFs();
    fillSelect($("#region"), REGION_IDS, T[S.lang].regions, t("regionPh"));
    fillDistricts($("#district"), $("#region").value, t("districtPh"));
    fillSelect($("#role"), ROLE_IDS, T[S.lang].roles, t("rolePh"));
    renderCaseText();
    $("#case-crit").innerHTML = T[S.lang].crit.map(function (c, i) { return "<li><b>" + (i + 1) + "</b>" + esc(c) + "</li>"; }).join("");
    $("#hero-crit").innerHTML = T[S.lang].crit.map(function (c, i) { return '<li title="' + esc(c) + '">' + esc((T[S.lang].critShort || [])[i] || c) + "</li>"; }).join("");
    renderNotices();
    updateCounter();
    renderWho();
    if (S.flow === "eval") renderEvalCard();
    if (S.flow === "result" && S.viewing) renderResult(S.viewing);
    renderHistory();
  }

  /* ---------- ko'rinishlar ---------- */
  var FLOW_VIEWS = ["start", "case", "eval", "result"];
  function show(view) {
    if (FLOW_VIEWS.indexOf(view) >= 0) { S.flow = view; S.view = "test"; } else { S.view = view; }
    var active = S.view === "test" ? S.flow : S.view;
    ["start", "case", "eval", "result", "history"].forEach(function (v) { $("#v-" + v).hidden = v !== active; });
    $("#tab-test").setAttribute("aria-current", S.view === "test" ? "page" : "false");
    $("#tab-history").setAttribute("aria-current", S.view === "history" ? "page" : "false");
    var locked = S.flow === "case";
    document.body.classList.toggle("in-test", locked && S.view === "test");
    $("#tab-history").disabled = locked;
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- holat xabarlari (kirish oynasida) ---------- */
  function renderNotices(extra) {
    var box = $("#notices");
    if (!box) return;
    var n;
    if (extra) n = extra;
    else if (!HAS_TG) n = ["warn", ICON.alert, t("tgOnly"), BOT_LINK ? '<a class="btn btn-secondary small" href="' + esc(BOT_LINK) + '" target="_blank" rel="noopener">' + esc(t("openBot")) + "</a>" : ""];
    else if (!CONFIGURED) n = ["warn", ICON.alert, t("noConfig")];
    else if (S.initError) n = ["bad", ICON.alert, S.initError === "auth" ? t("authErr") : t("netErr"), '<button type="button" class="btn btn-secondary small" data-retry="init">' + esc(t("tryAgain")) + "</button>"];
    else if (!S.ready) n = ["info", ICON.info, t("loading")];
    else n = ["ok", ICON.check, t("ready")];
    box.innerHTML = '<div class="notice ' + n[0] + ' cap">' + n[1] + '<span class="stack-8" style="gap:8px"><span>' + esc(n[2]) + "</span>" + (n[3] || "") + "</span></div>";
    $("#start-btn").disabled = !(HAS_TG && CONFIGURED && S.ready) || S.starting;
  }

  /* ---------- 1. kirish ---------- */
  function prefill(p) {
    if (!p) return;
    if (!$("#fio").value) $("#fio").value = p.fio || "";
    if (REGION_IDS.indexOf(p.region) >= 0) {
      $("#region").value = p.region;
      fillDistricts($("#district"), p.region, t("districtPh"));
      if (districtOk(p.region, p.district)) $("#district").value = p.district;
    }
    if (ROLE_IDS.indexOf(p.role) >= 0) $("#role").value = p.role;
  }
  function startTest(ev) {
    ev.preventDefault();
    if (S.starting || !validate()) return;
    S.starting = true;
    renderNotices();
    var p = { fio: $("#fio").value.trim().replace(/\s+/g, " "), region: $("#region").value, district: $("#district").value, role: $("#role").value, lang: S.lang };
    api("start", p).then(function (j) {
      /* server ismni oʻzbek lotin alifbosiga oʻgirib saqlaydi — sahifada ham shu koʻrinish */
      if (j.attempt.fio) { p.fio = j.attempt.fio; $("#fio").value = p.fio; }
      S.attempt = Object.assign({ answer: "" }, p, { id: j.attempt.id, caseId: j.attempt.caseId, deadline: j.attempt.deadline, startedAt: j.attempt.startedAt });
      store.set("ihma-tgprofile", { fio: p.fio, region: p.region, district: p.district, role: p.role });
      if (!j.resumed) return null;
      return loadDraft(S.attempt.id).then(function (d) { S.attempt.answer = d; });
    }).then(function () {
      S.starting = false;
      renderNotices();
      openCase();
    }, function (e) {
      S.starting = false;
      var code = e && e.code;
      renderNotices(["bad", ICON.alert, code === "auth" ? t("authErr") : (code === "network" ? t("netErr") : t("startErr"))]);
    });
  }
  function openCase() {
    $("#answer").value = S.attempt.answer || "";
    lastVal = $("#answer").value;
    $("#paste-note").hidden = true;
    $("#confirm").hidden = true;
    S.submitting = false;
    setPane("case");
    renderWho();
    renderCaseText();
    updateCounter();
    show("case");
    startTimer();
    if (TG && TG.enableClosingConfirmation) { try { TG.enableClosingConfirmation(); } catch (e) {} }
  }

  /* ---------- 2. keys: taymer va javob ---------- */
  function startTimer() {
    clearInterval(S.tick);
    var run = function () {
      if (!S.attempt) return;
      var left = Math.max(0, S.attempt.deadline - now());
      var m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      $("#timer-val").textContent = pad(m) + ":" + pad(s);
      $("#timer").classList.toggle("low", left <= 5 * 60000);
      if (left <= 0 && !S.submitting && S.flow === "case") submitAnswer(true);
    };
    run();
    S.tick = setInterval(run, 1000);
  }
  /* ---------- javob maydoni: tashqaridan matn qoʻyish (paste) taqiqlangan ----------
     Maqsad — AI yoki boshqa manbadan tayyor matnni koʻchirib qoʻyishning oldini olish.
     1) paste / drop hodisalari bekor qilinadi;
     2) beforeinput: "insertFromPaste" va h.k. turlari, hamda bir urinishda PASTE_MAX dan uzun "insertText"
        (Android klaviaturasining "bufer" tugmasi shunday qoʻyadi) bekor qilinadi;
     3) zaxira: input'dan keyin bir harakatda PASTE_MAX dan ortiq belgi qoʻshilgan boʻlsa — avvalgi matn qaytariladi.
     Istisno: xodim oʻz javobidan nusxalagan/qirqib olgan boʻlagini qayta qoʻyishi mumkin (matnni qayta tartiblash uchun).
     Urinishlar soni serverga yuboriladi (adminga halollik belgisi). */
  var PASTE_MAX = 40, lastVal = "", ownClip = "", noteT = null, allowOnce = false;
  function ptGet(id) { var x = store.get("ihma-pt"); return x && x.id === id ? (Number(x.n) || 0) : 0; }
  function blockNote(key) {
    var n = $("#paste-note");
    n.textContent = t(key);
    n.hidden = false;
    clearTimeout(noteT);
    noteT = setTimeout(function () { n.hidden = true; }, 6000);
    if (TG && TG.HapticFeedback) { try { TG.HapticFeedback.notificationOccurred("error"); } catch (e) {} }
  }
  function pasteBlocked() {
    if (S.attempt) store.set("ihma-pt", { id: S.attempt.id, n: ptGet(S.attempt.id) + 1 });
    blockNote("pasteBlocked");
  }
  function isOwn(txt) {
    txt = String(txt || "").replace(/\r\n/g, "\n");
    return !!ownClip && txt === ownClip;
  }
  function onClipOut() {   // javobning oʻzidan copy/cut — oʻz matnini koʻchirishga ruxsat
    var el = $("#answer");
    ownClip = el.value.slice(el.selectionStart, el.selectionEnd).replace(/\r\n/g, "\n");
  }
  function onPaste(e) {
    var txt = "";
    try { txt = (e.clipboardData || window.clipboardData).getData("text"); } catch (err) {}
    if (isOwn(txt)) { allowOnce = true; return; }
    e.preventDefault();
    pasteBlocked();
  }
  function onBeforeInput(e) {
    var it = e.inputType || "";
    if (allowOnce && /^insertFrom(Paste|PasteAsQuotation)$/.test(it)) return;
    if (/^insertFrom(Paste|PasteAsQuotation|Drop|Yank)$/.test(it) ||
        (/^insert(Text|ReplacementText)$/.test(it) && e.data && e.data.length > PASTE_MAX && !isOwn(e.data))) {
      e.preventDefault();
      pasteBlocked();
    }
  }
  var draftT = null;
  function onAnswer(e) {
    if (!S.attempt) return;
    var el = $("#answer"), v = el.value, it = (e && e.inputType) || "", grow = v.length - lastVal.length;
    if (grow > PASTE_MAX && !allowOnce && !/^history/.test(it)) {
      var end = el.selectionEnd, ins = v.slice(Math.max(0, end - grow), end);
      if (!isOwn(ins)) {
        el.value = lastVal;
        try { el.selectionStart = el.selectionEnd = Math.max(0, Math.min(lastVal.length, end - grow)); } catch (err) {}
        pasteBlocked();
        return;
      }
    }
    allowOnce = false;
    lastVal = v;
    S.attempt.answer = v;
    updateCounter();
    clearTimeout(draftT);
    draftT = setTimeout(saveDraft, 1200);
  }
  function submitAnswer(auto) {
    if (S.submitting || !S.attempt) return;
    S.submitting = true;
    clearInterval(S.tick);
    var att = S.attempt;
    att.answer = $("#answer").value;
    saveDraft();
    S.autoSent = !!auto;
    S.sendError = null;
    S.waitId = null;
    show("eval");
    renderEvalCard();
    api("submit", { attemptId: att.id, answer: att.answer, auto: !!auto, pasteTries: ptGet(att.id) }).then(function () {
      clearDraft(att.id);
      S.submitting = false;
      S.waitId = att.id;
      S.sentAt = Date.now();
      if (TG) {
        try { TG.disableClosingConfirmation(); } catch (e) {}
        askWriteAccess();
      }
      renderEvalCard();
      startPoll();
      refreshHistory();
    }, function (e) {
      S.submitting = false;
      S.sendError = (e && e.code) || "network";
      renderEvalCard();
    });
  }
  /* bot xodimga xabar yoza olishi uchun ruxsat (bot chatida Start bosilmagan bo'lsa) */
  function askWriteAccess() {
    try {
      var u = TG.initDataUnsafe && TG.initDataUnsafe.user;
      if (u && u.allows_write_to_pm) return;
      if (TG.requestWriteAccess && (!TG.isVersionAtLeast || TG.isVersionAtLeast("6.9"))) TG.requestWriteAccess(function () {});
    } catch (e) {}
  }

  /* ---------- 3. yuborish va kutish ---------- */
  function renderEvalCard() {
    var card = $("#eval-card");
    card.classList.remove("sent-card");
    if (S.submitting) {
      card.innerHTML = '<div class="spinner" aria-hidden="true"></div><h1>' + esc(t("sending")) + "</h1>";
      return;
    }
    if (S.sendError) {
      var left = S.attempt ? S.attempt.deadline - now() : 0;
      card.innerHTML =
        '<div class="notice bad">' + ICON.alert + "<span>" + esc(S.sendError === "auth" ? t("authErr") : t("sendErr")) + "</span></div>" +
        '<div class="actions"><button type="button" class="btn btn-primary" data-wait="resend">' + ICON.refresh + "<span>" + esc(t("resend")) + "</span></button>" +
        (left > 0 ? '<button type="button" class="btn btn-secondary" data-wait="edit">' + esc(t("paneAnswer")) + "</button>" : "") + "</div>";
      return;
    }
    if (S.evalFailed) {
      card.innerHTML = '<div class="notice warn">' + ICON.alert + "<span>" + esc(t("evalFail")) + "</span></div>" +
        '<div class="actions"><button type="button" class="btn btn-secondary" data-wait="history">' + esc(t("btnHistory")) + "</button></div>";
      return;
    }
    /* Javob qabul qilindi — jarayon belgisi (spinner) yoʻq: xodim oynani bemalol yopishi mumkinligini koʻrsin.
       Natija tayyor boʻlsa, sahifa uni orqa fonda (sezdirmasdan) tekshirib turadi. */
    var mins = S.sentAt ? Math.floor((Date.now() - S.sentAt) / 60000) : 0;
    card.classList.add("sent-card");
    card.innerHTML =
      '<div class="sent-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
      "<h1>" + esc(t("sentTitle")) + "</h1>" +
      (S.autoSent ? '<div class="notice warn cap">' + ICON.info + "<span>" + esc(t("timeUp")) + "</span></div>" : "") +
      "<p>" + esc(t("sentText")) + "</p>" +
      '<p class="cap muted num" id="wait-status">' + esc(t("sentWait", { m: mins })) + "</p>" +
      '<div class="actions">' + (TG && TG.close ? '<button type="button" class="btn btn-primary" data-wait="close">' + esc(t("closeWin")) + "</button>" : "") +
      '<button type="button" class="btn btn-secondary" data-wait="history">' + esc(t("btnHistory")) + "</button></div>";
  }
  function onEvalAction(e) {
    var b = e.target.closest("[data-wait]");
    if (!b) return;
    var act = b.getAttribute("data-wait");
    if (act === "resend") submitAnswer(S.autoSent);
    else if (act === "edit") { S.sendError = null; openCase(); setPane("answer"); }
    else if (act === "history") { show("history"); refreshHistory(); }
    else if (act === "close") { try { TG.close(); } catch (err) {} }
  }
  function stopPoll() { clearInterval(S.poll); S.poll = null; }
  function checkResult() {
    if (!S.waitId) return;
    var el = $("#wait-status");
    if (el && S.sentAt) el.textContent = t("sentWait", { m: Math.floor((Date.now() - S.sentAt) / 60000) });
    if (document.hidden) return;
    var id = S.waitId;
    api("result", { attemptId: id }).then(function (j) {
      if (S.waitId !== id) return;
      var a = fromServer(j.attempt);
      if (a.status === "done" && a.result) {
        stopPoll();
        S.waitId = null;
        S.viewing = a;
        S.resultFrom = "flow";
        renderResult(a);
        if (S.view === "test") show("result"); else S.flow = "result";
        refreshHistory();
      } else if (a.status === "error") {
        stopPoll();
        S.waitId = null;
        S.evalFailed = true;
        renderEvalCard();
        refreshHistory();
      }
    }, function () {});
  }
  function startPoll() {
    stopPoll();
    S.evalFailed = false;
    S.poll = setInterval(checkResult, 45000);
    setTimeout(checkResult, 8000);
  }

  /* ---------- 4a. natija grafikalari (PDF hisobotdagi kabi): radar, mezon shkalalari, kuchli tomonlar / eʼtibor nuqtalari ---------- */
  var ICON_RADAR = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8.5 6.2-3.2 10H6.7L3.5 9.2z"/><path d="M12 8l4 3-1.5 4.5h-5L8 11z"/></svg>';
  function lvOf(ratio) { return ratio >= 0.75 ? "ok" : ratio >= 0.5 ? "warn" : "bad"; }
  function critData(r) {
    var full = T[S.lang].crit, short = T[S.lang].critShort || full;
    return (r.criteria || []).map(function (c, i) {
      var max = Number(c.max) || 4, sc = Math.max(0, Math.min(max, Number(c.score) || 0));
      return { i: i, n: c.n || i + 1, name: full[(c.n || i + 1) - 1] || "#" + (i + 1), short: short[(c.n || i + 1) - 1] || "#" + (i + 1),
        score: sc, max: max, ratio: sc / max, awarded: (c.awarded || []).map(String), deducted: (c.deducted || []).map(String) };
    });
  }
  function radarSvg(cr) {
    var W = 360, H = 290, cx = 180, cy = 148, R = 92, n = cr.length;
    var pt = function (i, r) { var a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
    var xy = function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); };
    var s = '<svg class="radar" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t("visTitle")) + '">';
    [0.25, 0.5, 0.75, 1].forEach(function (k) {
      s += '<polygon class="rd-ring' + (k === 1 ? " outer" : "") + '" points="' + cr.map(function (c, i) { return xy(pt(i, R * k)); }).join(" ") + '"/>';
    });
    cr.forEach(function (c, i) { var p = pt(i, R); s += '<line class="rd-axis" x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '"/>'; });
    s += '<polygon class="rd-area" points="' + cr.map(function (c, i) { return xy(pt(i, R * Math.max(0.03, c.ratio))); }).join(" ") + '"/>';
    cr.forEach(function (c, i) { var p = pt(i, R * Math.max(0.03, c.ratio)); s += '<circle class="rd-dot ' + lvOf(c.ratio) + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5"/>'; });
    cr.forEach(function (c, i) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n, cos = Math.cos(a), sin = Math.sin(a), p = pt(i, R + 16);
      var anchor = Math.abs(cos) < 0.2 ? "middle" : cos > 0 ? "start" : "end";
      var words = c.short.split(" "), lines = c.short.length > 13 && words.length > 1 ? [words.slice(0, Math.ceil(words.length / 2)).join(" "), words.slice(Math.ceil(words.length / 2)).join(" ")] : [c.short];
      var y0 = p[1] + (sin < -0.5 ? -(lines.length) * 13 : sin > 0.5 ? 6 : -((lines.length + 1) * 13) / 2 + 9);
      s += '<text class="rd-lbl" text-anchor="' + anchor + '" x="' + p[0].toFixed(1) + '" y="' + y0.toFixed(1) + '">' +
        lines.map(function (ln, k) { return '<tspan x="' + p[0].toFixed(1) + '" dy="' + (k ? 13 : 0) + '">' + esc(ln) + "</tspan>"; }).join("") +
        '<tspan class="rd-val ' + lvOf(c.ratio) + '" x="' + p[0].toFixed(1) + '" dy="14">' + fmtNum(c.score) + " / " + c.max + "</tspan></text>";
    });
    return s + "</svg>";
  }
  function visBlocks(att) {
    var r = att.result;
    if (!r || !r.criteria || !r.criteria.length) return null;
    var cr = critData(r), total = Number(r.total), max = Number(r.max) || 20;
    var lv = lvOf(max ? total / max : 0);
    var scales = '<ul class="scales">' + cr.map(function (c) {
      var seg = "";
      for (var k = 0; k < c.max; k++) seg += '<i><b style="width:' + Math.round(Math.max(0, Math.min(1, c.score - k)) * 100) + '%"></b></i>';
      return '<li class="sc-row lv-' + lvOf(c.ratio) + '"><span class="sc-n">' + c.n + '</span><span class="sc-name">' + esc(c.name) + "</span>" +
        '<span class="sc-val num">' + fmtNum(c.score) + " / " + c.max + '</span><span class="sc-bar" aria-hidden="true">' + seg + "</span></li>";
    }).join("") + "</ul>";
    var vis = '<div class="card raised stack-16"><div class="vis-head"><h2 class="row">' + ICON_RADAR + "<span>" + esc(t("visTitle")) + "</span></h2>" +
      '<span class="lv-chip ' + lv + '">' + esc(t(lv === "ok" ? "lvHigh" : lv === "warn" ? "lvMid" : "lvLow")) + "</span></div>" +
      '<div class="vis-grid"><div class="vis-radar">' + radarSvg(cr) + "</div>" + scales + "</div></div>";
    /* kuchli tomonlar va eʼtibor nuqtalari — PDF bilan bir xil qoida */
    var srt = cr.slice().sort(function (a, b) { return b.ratio - a.ratio || a.i - b.i; });
    var strong = srt.filter(function (c) { return c.ratio > 0; }).slice(0, 2);
    var weak = srt.slice().reverse().filter(function (c) { return strong.indexOf(c) < 0 && c.ratio < 1; }).slice(0, 2);
    var box = function (list, key, cls, pick) {
      if (!list.length) return "";
      return '<section class="sw ' + cls + '"><h3>' + esc(t(key)) + "</h3>" + list.map(function (c) {
        var pts = c[pick].slice(0, 2);
        return '<div class="sw-item"><b>' + esc(c.name) + ' <span class="num">— ' + fmtNum(c.score) + "/" + c.max + "</span></b>" +
          (pts.length ? "<ul>" + pts.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") + "</div>";
      }).join("") + "</section>";
    };
    var sw = strong.length || weak.length
      ? '<div class="sw-grid' + (strong.length && weak.length ? "" : " solo") + '">' + box(strong, "strongTitle", "sw-ok", "awarded") + box(weak, "weakTitle", "sw-warn", "deducted") + "</div>"
      : "";
    return { vis: vis, sw: sw };
  }

  /* ---------- 4. hakam bahosi ---------- */
  function renderResult(att) {
    var parts = resultBlocks(att, true), vb = parts ? visBlocks(att) : null;
    var head = '<div class="res-head"><div class="card raised stack-16">' +
      '<div class="stack-8"><span class="eyebrow">' + esc(t("resEyebrow")) + "</span><h1>" + esc(t("judgeTitle")) + "</h1></div>" +
      metaBlock(att) + "</div></div>";
    var actions = '<div class="res-act"><div class="card stack-8"><div class="actions">' +
      '<button type="button" class="btn btn-secondary" data-act="copy">' + ICON.copy + "<span>" + esc(t("btnCopy")) + "</span></button>" +
      (S.resultFrom === "history"
        ? '<button type="button" class="btn btn-primary" data-act="back">' + esc(t("back")) + "</button>"
        : '<button type="button" class="btn btn-primary" data-act="new">' + esc(t("btnNew")) + "</button>" +
          '<button type="button" class="btn btn-secondary" data-act="history">' + esc(t("btnHistory")) + "</button>") +
      '</div><p class="cap muted" id="act-msg" aria-live="polite"></p></div></div>';
    $("#result-body").classList.toggle("split", !!parts);
    $("#result-body").innerHTML = parts
      ? '<div class="res-side">' + head + '<div class="res-indep">' + parts.indep + "</div>" + actions + "</div>" +
        '<div class="res-main"><div class="res-score">' + parts.score + "</div>" +
        (vb ? '<div class="res-vis">' + vb.vis + "</div>" + (vb.sw ? '<div class="res-sw">' + vb.sw + "</div>" : "") : "") +
        '<div class="res-crit">' + parts.crit + "</div></div>"
      : head + actions;
  }
  function onResultAction(e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    var msg = $("#act-msg");
    if (act === "copy" && S.viewing) {
      var txt = resultText(S.viewing);
      var done = function (ok) { if (msg) msg.textContent = ok ? t("copied") : t("copyFail"); };
      try { navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); }); } catch (err) { done(false); }
    } else if (act === "new") {
      S.attempt = null; S.viewing = null;
      show("start");
    } else if (act === "history" || act === "back") {
      show("history");
      refreshHistory();
    }
  }

  /* ---------- 5. mening natijalarim ---------- */
  function renderHistory(note) {
    var box = $("#hist-list");
    if (!box) return;
    if (!HAS_TG) { box.innerHTML = '<p class="empty">' + esc(t("histNoAcc")) + "</p>"; return; }
    if (!S.ready) { box.innerHTML = '<p class="empty">' + esc(S.initError ? t("netErr") : t("loading")) + "</p>"; return; }
    var atts = sortAtts(S.history);
    var head = note ? '<div class="notice info cap">' + ICON.info + "<span>" + esc(note) + "</span></div>" : "";
    if (!atts.length) { box.innerHTML = head + '<p class="empty">' + esc(t("histEmpty")) + "</p>"; return; }
    box.innerHTML = head + atts.map(function (a) {
      var score = a.status === "done" && a.total != null
        ? '<span class="badge ' + scoreClass(a.total, a.max) + ' num">' + fmtNum(a.total) + " / " + a.max + "</span>"
        : statusBadge(a);
      return '<div class="hist-item"><div class="stack-8" style="gap:2px"><b class="num">' + esc(fmtDate(a.submittedAt || a.startedAt)) + "</b>" +
        '<span class="cap muted">' + esc(caseLabel(a.caseId)) + "</span></div>" +
        '<div class="row">' + score + (a.status === "done" ? '<button type="button" class="btn btn-secondary small" data-open="' + esc(a.id) + '">' + esc(t("view")) + "</button>" : "") + "</div></div>";
    }).join("");
  }
  function openResult(id, from) {
    return api("result", { attemptId: id }).then(function (j) {
      var a = fromServer(j.attempt);
      if (a.status === "done" && a.result) {
        S.viewing = a;
        S.resultFrom = from;
        renderResult(a);
        show("result");
      } else {
        show("history");
        renderHistory(a.status === "error" ? t("evalFail") : t("notReady"));
      }
    }, function (e) {
      show("history");
      renderHistory(e && e.code === "notfound" ? t("notFound") : t("netErr"));
    });
  }
  function onHistoryClick(e) {
    var b = e.target.closest("[data-open]");
    if (!b) return;
    b.disabled = true;
    openResult(b.getAttribute("data-open"), "history").then(function () { b.disabled = false; });
  }
  function refreshHistory() {
    if (!HAS_TG || !CONFIGURED) return;
    api("init").then(function (j) { S.history = (j.history || []).map(fromShort); renderHistory(); }, function () {});
  }

  /* ---------- ishga tushirish ---------- */
  function resume(act, prof) {
    S.attempt = {
      id: act.id, caseId: act.caseId, deadline: act.deadline, startedAt: act.startedAt, lang: S.lang, answer: "",
      fio: (prof && prof.fio) || "", region: prof && prof.region, district: prof && prof.district, role: prof && prof.role
    };
    return loadDraft(act.id).then(function (d) {
      S.attempt.answer = d || "";
      openCase();
      /* vaqt tugagan bo'lsa, saqlangan qoralama avtomatik yuboriladi */
      if (act.deadline - now() <= 0) submitAnswer(true);
    });
  }
  function boot() {
    S.initError = null;
    S.ready = false;
    renderNotices();
    renderHistory();
    if (!HAS_TG || !CONFIGURED) return;
    api("init").then(function (j) {
      S.ready = true;
      S.history = (j.history || []).map(fromShort);
      var prof = j.profile || store.get("ihma-tgprofile");
      prefill(prof);
      renderNotices();
      renderHistory();
      var q = "";
      try { q = new URLSearchParams(location.search).get("a") || ""; } catch (e) {}
      if (!q && TG.initDataUnsafe && TG.initDataUnsafe.start_param) q = TG.initDataUnsafe.start_param;
      if (j.active) return resume(j.active, prof);
      if (q) return openResult(q, "history");
    }, function (e) {
      S.initError = (e && e.code) || "network";
      renderNotices();
      renderHistory();
    });
  }

  /* Standart — yorug' rejim (Telegram yoki telefon qorong'i bo'lsa ham). Xodim 🌙 tugmasi bilan o'zgartirsa, tanlovi eslab qolinadi. */
  if (!store.get("ihma-theme")) document.documentElement.setAttribute("data-theme", "light");
  try { updateThemeBtn(); } catch (e) {}
  /* Telegram oynasi: telefonda toʻliq balandlik (expand), kompyuterda butun ekran (requestFullscreen, Bot API 8.0+).
     Toʻliq ekranda Telegram oʻz tugmalarini (⋮ ✕) sahifa ustiga qoʻyadi — ular ostida qolmaslik uchun xavfsiz hudud hisobga olinadi. */
  var TG_DESKTOP = !!(TG && /^(tdesktop|macos|web|weba|webk|unigram)$/.test(String(TG.platform || "")));
  function applyInsets() {
    if (!TG) return;
    var sa = TG.safeAreaInset || {}, ca = TG.contentSafeAreaInset || {};
    var top = (Number(sa.top) || 0) + (Number(ca.top) || 0);
    var bottom = (Number(sa.bottom) || 0) + (Number(ca.bottom) || 0);
    var st = document.documentElement.style;
    st.setProperty("--tg-top", top + "px");
    st.setProperty("--tg-bottom", bottom + "px");
    st.setProperty("--tg-reserve", TG.isFullscreen && TG_DESKTOP && top === 0 ? "96px" : "0px");
  }
  if (TG) {
    try { TG.ready(); TG.expand(); } catch (e) {}
    try {
      ["fullscreenChanged", "safeAreaChanged", "contentSafeAreaChanged", "viewportChanged"].forEach(function (ev) { TG.onEvent(ev, applyInsets); });
      if (TG_DESKTOP && !TG.isFullscreen && TG.requestFullscreen && TG.isVersionAtLeast && TG.isVersionAtLeast("8.0")) TG.requestFullscreen();
    } catch (e) {}
    applyInsets();
    if (document.documentElement.getAttribute("data-theme") === "light") {
      try { TG.setHeaderColor("#FFFFFF"); TG.setBackgroundColor("#E8F1FF"); } catch (e) {}
    }
  }

  $$(".langs button").forEach(function (b) { b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); }); });
  $("#theme-btn").addEventListener("click", toggleTheme);
  $("#fs-dec").addEventListener("click", function () { if (fsIdx > 0) { fsIdx -= 1; applyFs(); } });
  $("#fs-inc").addEventListener("click", function () { if (fsIdx < FS_STEPS.length - 1) { fsIdx += 1; applyFs(); } });
  $("#tab-test").addEventListener("click", function () { show(S.flow); });
  $("#tab-history").addEventListener("click", function () { show("history"); refreshHistory(); });
  $("#start-form").addEventListener("submit", startTest);
  $("#region").addEventListener("change", function () { fillDistricts($("#district"), this.value, t("districtPh")); });
  ["#fio", "#region", "#district", "#role"].forEach(function (s) {
    $(s).addEventListener("input", function () { var f = $(s).closest(".field"); if (f.classList.contains("invalid")) { f.classList.remove("invalid"); $(".field-err", f).hidden = true; } });
  });
  $("#answer").addEventListener("input", onAnswer);
  $("#answer").addEventListener("beforeinput", onBeforeInput);
  $("#answer").addEventListener("paste", onPaste);
  $("#answer").addEventListener("drop", function (e) { e.preventDefault(); pasteBlocked(); });
  $("#answer").addEventListener("copy", onClipOut);
  $("#answer").addEventListener("cut", onClipOut);
  /* keys matnini nusxalab (AI'ga berib) boʻlmasin */
  ["copy", "cut"].forEach(function (ev) {
    $("#pane-case").addEventListener(ev, function (e) { e.preventDefault(); });
  });
  $("#pane-case").addEventListener("contextmenu", function (e) { e.preventDefault(); });
  $("#submit-btn").addEventListener("click", function () { $("#confirm").hidden = false; $("#confirm-yes").focus(); });
  $("#confirm-no").addEventListener("click", function () { $("#confirm").hidden = true; $("#answer").focus(); });
  $("#confirm-yes").addEventListener("click", function () { submitAnswer(false); });
  $("#result-body").addEventListener("click", onResultAction);
  $("#hist-list").addEventListener("click", onHistoryClick);
  $("#eval-card").addEventListener("click", onEvalAction);
  $("#notices").addEventListener("click", function (e) { if (e.target.closest("[data-retry]")) boot(); });
  $$(".pane-switch button").forEach(function (b) { b.addEventListener("click", function () { setPane(b.getAttribute("data-pane")); }); });
  $("#to-answer").addEventListener("click", function () { setPane("answer"); try { window.scrollTo(0, 0); } catch (e) {} });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.waitId) checkResult(); });
  (function () {
    var tb = $(".topbar");
    var setH = function () { document.documentElement.style.setProperty("--tb-h", Math.round(tb.getBoundingClientRect().height) + "px"); };
    setH();
    try { new ResizeObserver(setH).observe(tb); } catch (e) { window.addEventListener("resize", setH); }
  })();

  applyFs();
  applyLang();
  show("start");
  boot();
})();
</script>
</body>
</html>
