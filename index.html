<!doctype html>
<html lang="uz-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISTC malaka baholash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: ISTC e-learning uslubi — oq yumaloq yuqori panel, och ko'k fon, oq kartalar; test oqimi + admin paneli bitta sahifada.
   Ranglar ISTC-dizayn-qoidalari.md dan. "-soft" va "-text" tokenlari holat ranglaridan kontrast uchun hosil qilingan. */
:root {
  --ihma-primary: #2964C2;
  --ihma-primary-dark: #1D4FA8;
  --ihma-navy: #173F8F;
  --ihma-menu-item: #3475DB;
  --ihma-menu-active: #3F86E6;
  --ihma-accent: #2CCFBE;
  --ihma-bg: #E8F1FF;
  --ihma-soft: #EEF4FF;
  --ihma-card: #FFFFFF;
  --ihma-line: #D3E1F7;
  --ihma-line-2: #BCD2F5;
  --ihma-text: #1F2D4D;
  --ihma-muted: #5D6B85;
  --ihma-success: #5CC871;
  --ihma-success-dark: #1F9D3A;
  --ihma-warning: #D39B17;
  --ihma-danger: #C0151A;
  /* hosila tokenlar (holat fonlari va o'qiladigan matn ranglari) */
  --ihma-success-soft: #E7F6EA;
  --ihma-success-text: #17762C;
  --ihma-warning-soft: #FBF3DF;
  --ihma-warning-text: #6B4E00;
  --ihma-danger-soft: #FCE9E9;
  --ihma-on-dark: #FFFFFF;
  --ihma-on-dark-muted: #C9D8F5;
  /* to'ldirilgan fonlar (oq matn ostida) va chiziqlar — qorong'i rejimda alohida qiymat oladi */
  --ihma-fill: #2964C2;
  --ihma-fill-hover: #1D4FA8;
  --ihma-banner: #173F8F;
  --ihma-success-line: #BFE6C8;
  --ihma-warning-line: #EBD39A;
  --ihma-danger-line: #F2C2C3;
  --ihma-row-hover: #F6F9FF;
  --ihma-raised-border: transparent;

  --ihma-font: "Montserrat", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --fs-scale: 1;
  --fs-h1: calc(24px * var(--fs-scale));
  --fs-h2: calc(17px * var(--fs-scale));
  --fs-body: calc(14px * var(--fs-scale));
  --fs-cap: calc(12px * var(--fs-scale));
  --fs-num: calc(36px * var(--fs-scale));
  --radius-card: 12px;
  --radius-ctl: 10px;
  --shadow: 0 8px 30px rgba(20, 40, 90, .12);
  color-scheme: light;
}
/* Qorong'i rejim: ISTC qoidalarida yo'q, shu sababli asosiy ko'kdan hosil qilingan; matn kontrasti 4.5:1 dan yuqori */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ihma-primary: #7FAAF0; --ihma-primary-dark: #A9C6F6; --ihma-navy: #DCE7FB;
    --ihma-bg: #0E1729; --ihma-soft: #18263F; --ihma-card: #131F35; --ihma-line: #26385A; --ihma-line-2: #35507D;
    --ihma-text: #E3EAF7; --ihma-muted: #9AA9C4; --ihma-danger: #FF8A8C;
    --ihma-success-soft: #13301E; --ihma-success-text: #7FD99A; --ihma-success-line: #24553A;
    --ihma-warning-soft: #33290F; --ihma-warning-text: #F0C866; --ihma-warning-line: #5C4A1C;
    --ihma-danger-soft: #3A1517; --ihma-danger-line: #6B2A2D;
    --ihma-fill: #2F6BCB; --ihma-fill-hover: #2558B0; --ihma-banner: #173F8F;
    --ihma-row-hover: #1A2A46; --ihma-raised-border: #26385A;
    --shadow: 0 8px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ihma-primary: #7FAAF0; --ihma-primary-dark: #A9C6F6; --ihma-navy: #DCE7FB;
  --ihma-bg: #0E1729; --ihma-soft: #18263F; --ihma-card: #131F35; --ihma-line: #26385A; --ihma-line-2: #35507D;
  --ihma-text: #E3EAF7; --ihma-muted: #9AA9C4; --ihma-danger: #FF8A8C;
  --ihma-success-soft: #13301E; --ihma-success-text: #7FD99A; --ihma-success-line: #24553A;
  --ihma-warning-soft: #33290F; --ihma-warning-text: #F0C866; --ihma-warning-line: #5C4A1C;
  --ihma-danger-soft: #3A1517; --ihma-danger-line: #6B2A2D;
  --ihma-fill: #2F6BCB; --ihma-fill-hover: #2558B0; --ihma-banner: #173F8F;
  --ihma-row-hover: #1A2A46; --ihma-raised-border: #26385A;
  --shadow: 0 8px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ihma-bg);
  color: var(--ihma-text);
  font-family: var(--ihma-font);
  font-size: var(--fs-body);
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: var(--fs-h1); line-height: 1.25; font-weight: 700; color: var(--ihma-navy); }
h2 { font-size: var(--fs-h2); line-height: 1.35; font-weight: 600; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ihma-navy); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ihma-muted); }
.cap { font-size: var(--fs-cap); }
.eyebrow { font-size: var(--fs-cap); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ihma-muted); }
.icon { width: 18px; height: 18px; flex: none; }

/* yuqori panel: tepaga qotirilgan, ixcham — brend | bo'limlar | sozlamalar */
.shell { max-width: 2560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: calc(env(safe-area-inset-top, 0px) + 8px); background: var(--ihma-bg); z-index: 19; }
.topbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 20;
  background: var(--ihma-card); border: 1px solid var(--ihma-raised-border); border-radius: var(--radius-card); box-shadow: var(--shadow);
  padding: 8px 8px 8px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 36px; height: 36px; border-radius: var(--radius-ctl); background: var(--ihma-fill); color: var(--ihma-on-dark); display: grid; place-items: center; flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand-name { font-weight: 700; font-size: var(--fs-h2); color: var(--ihma-navy); letter-spacing: .02em; }
.brand-sub { font-size: var(--fs-cap); color: var(--ihma-muted); white-space: nowrap; }
.tabs { justify-self: center; display: flex; gap: 4px; padding: 4px; background: var(--ihma-soft); border-radius: 12px; }
.tab {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: transparent; color: var(--ihma-text);
  font-weight: 600; padding: 0 14px; min-height: 40px; border-radius: 9px; cursor: pointer; white-space: nowrap;
}
.tab:hover { background: var(--ihma-card); }
.tab[aria-current="page"] { background: var(--ihma-fill); color: var(--ihma-on-dark); box-shadow: 0 2px 8px rgba(41, 100, 194, .28); }
.tab:disabled { opacity: .45; cursor: not-allowed; background: transparent; }
.l-short { display: none; }
.utils { display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--ihma-soft); border-radius: 12px; }
.langs { display: flex; gap: 2px; }
.langs button, .u-btn {
  min-width: 40px; height: 40px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent;
  color: var(--ihma-muted); font-weight: 700; font-size: var(--fs-cap); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 1px;
}
.u-btn { color: var(--ihma-text); }
.langs button:hover, .u-btn:hover { background: var(--ihma-card); color: var(--ihma-text); }
.langs button[aria-pressed="true"] { background: var(--ihma-card); color: var(--ihma-primary); box-shadow: 0 1px 4px rgba(20, 40, 90, .14); }
.u-btn:disabled { opacity: .4; cursor: not-allowed; background: transparent; }
.u-sep { width: 1px; height: 22px; background: var(--ihma-line-2); margin: 0 4px; flex: none; }
.a-small { font-size: 12px; }
.a-big { font-size: 16px; }
@media (max-width: 1080px) {
  .topbar { grid-template-columns: minmax(0, 1fr) auto; }
  .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
  .tabs .tab { flex: 1 1 0; }
}
@media (max-width: 600px) {
  .topbar { padding: 8px; }
  .brand-text { display: none; }
  .l-long { display: none; }
  .l-short { display: inline; }
  .tab { padding: 0 8px; gap: 6px; }
  .langs button, .u-btn { min-width: 36px; padding: 0 6px; }
  .u-sep { margin: 0 2px; }
}

/* umumiy bloklar */
.view { display: flex; flex-direction: column; gap: 24px; }
.card { background: var(--ihma-card); border: 1px solid var(--ihma-line); border-radius: var(--radius-card); padding: 24px; min-width: 0; }
.card.raised { box-shadow: var(--shadow); border-color: var(--ihma-raised-border); }
.stack-8 { display: flex; flex-direction: column; gap: 8px; }
.stack-16 { display: flex; flex-direction: column; gap: 16px; }
.stack-24 { display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.row.between { justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start; }
.grid-case { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
.grid-case .textarea { flex: 1 1 auto; }
@media (max-width: 880px) { .grid-2, .grid-case { grid-template-columns: minmax(0, 1fr); } }

/* banner */
.banner { background: var(--ihma-banner); color: var(--ihma-on-dark); border-radius: var(--radius-card); padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.banner .eyebrow { color: var(--ihma-on-dark-muted); display: flex; align-items: center; gap: 8px; }
.banner .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ihma-accent); flex: none; }
.banner h1 { color: var(--ihma-on-dark); }
.banner p { color: var(--ihma-on-dark-muted); max-width: 68ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts li { background: rgba(255, 255, 255, .12); border-radius: 20px; padding: 6px 14px; font-weight: 600; font-size: var(--fs-cap); color: var(--ihma-on-dark); }
@media (max-width: 520px) { .banner { padding: 24px; } }

/* forma */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; }
.input, .select, .textarea {
  width: 100%; border: 1px solid var(--ihma-line-2); border-radius: var(--radius-ctl); background: var(--ihma-card);
  padding: 0 14px; min-height: 48px; color: var(--ihma-text);
}
.textarea { padding: 14px; min-height: 360px; line-height: 1.7; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--ihma-primary); box-shadow: 0 0 0 3px rgba(41, 100, 194, .18); }
.field.invalid .input, .field.invalid .select { border-color: var(--ihma-danger); }
.field-err { color: var(--ihma-danger); font-size: var(--fs-cap); font-weight: 500; }
.hint { color: var(--ihma-muted); font-size: var(--fs-cap); }

.btn {
  min-height: 44px; padding: 0 20px; border-radius: var(--radius-ctl); border: 1px solid transparent;
  font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn-primary { background: var(--ihma-fill); color: var(--ihma-on-dark); }
.btn-primary:hover { background: var(--ihma-fill-hover); }
.btn-secondary { background: var(--ihma-card); border-color: var(--ihma-primary); color: var(--ihma-primary); }
.btn-secondary:hover { background: var(--ihma-soft); }
.btn:disabled { background: var(--ihma-line); border-color: transparent; color: var(--ihma-muted); cursor: not-allowed; }
.btn.block { width: 100%; min-height: 48px; }
.btn.small { min-height: 36px; padding: 0 14px; font-size: var(--fs-cap); }

/* xabarlar */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius-ctl); border: 1px solid transparent; }
.notice .icon { margin-top: 2px; }
.notice.info { background: var(--ihma-soft); border-color: var(--ihma-line); color: var(--ihma-text); }
.notice.warn { background: var(--ihma-warning-soft); border-color: var(--ihma-warning-line); color: var(--ihma-warning-text); }
.notice.ok { background: var(--ihma-success-soft); border-color: var(--ihma-success-line); color: var(--ihma-success-text); }
.notice.bad { background: var(--ihma-danger-soft); border-color: var(--ihma-danger-line); color: var(--ihma-danger); }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: var(--fs-cap); font-weight: 600; white-space: nowrap; }
.badge.ok { background: var(--ihma-success-soft); color: var(--ihma-success-text); }
.badge.warn { background: var(--ihma-warning-soft); color: var(--ihma-warning-text); }
.badge.bad { background: var(--ihma-danger-soft); color: var(--ihma-danger); }
.badge.info { background: var(--ihma-soft); color: var(--ihma-primary-dark); }

/* "qanday o'tadi" */
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 16px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps li::before {
  content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--ihma-soft); color: var(--ihma-primary);
  display: grid; place-items: center; font-weight: 700; font-size: var(--fs-cap);
}

/* keys */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 16px; }
.who { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.timer { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; background: var(--ihma-soft); color: var(--ihma-navy); font-weight: 600; }
.timer b { font-size: var(--fs-h2); font-variant-numeric: tabular-nums; }
.timer.low { background: var(--ihma-warning-soft); color: var(--ihma-warning-text); }
.task-box { background: var(--ihma-soft); border-radius: var(--radius-ctl); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.task-box .eyebrow { color: var(--ihma-primary-dark); }
.task-box p { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips li { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--ihma-line); background: var(--ihma-card); font-size: var(--fs-cap); font-weight: 500; }
.chips li b { color: var(--ihma-primary); margin-right: 4px; }
.divider { height: 1px; background: var(--ihma-line); }
.confirm { border: 1px solid var(--ihma-line-2); background: var(--ihma-soft); border-radius: var(--radius-ctl); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* baholanmoqda */
.eval-card { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--ihma-soft); border-top-color: var(--ihma-primary); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: var(--ihma-accent); } }

/* natija */
.score-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 24px; align-items: center; }
.medal { width: 64px; height: 64px; border-radius: 50%; background: var(--ihma-soft); color: var(--ihma-primary); display: grid; place-items: center; }
.medal svg { width: 34px; height: 34px; }
.score-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.score-big { font-size: var(--fs-num); font-weight: 700; color: var(--ihma-navy); line-height: 1.1; font-variant-numeric: tabular-nums; }
.score-max { font-size: var(--fs-h2); font-weight: 600; color: var(--ihma-muted); }
.meter { height: 8px; border-radius: 20px; background: var(--ihma-soft); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 20px; background: var(--ihma-accent); }
.score-summary { grid-column: 1 / -1; }
@media (max-width: 520px) { .score-card { grid-template-columns: minmax(0, 1fr); } }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 24px; }
.meta div { display: flex; flex-direction: column; min-width: 0; }
.meta dt { font-size: var(--fs-cap); color: var(--ihma-muted); }
.meta dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.crit { border: 1px solid var(--ihma-line); border-radius: var(--radius-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.crit-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.crit-head h3 { font-size: var(--fs-body); font-weight: 600; }
.crit-head h3 span { color: var(--ihma-primary); margin-right: 6px; font-variant-numeric: tabular-nums; }
.crit-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.reasons { display: flex; flex-direction: column; gap: 6px; }
.reasons .r-title { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--fs-cap); }
.reasons.plus .r-title { color: var(--ihma-success-text); }
.reasons.minus .r-title { color: var(--ihma-warning-text); }
.reasons ul { display: flex; flex-direction: column; gap: 4px; }
.reasons li { position: relative; padding-left: 14px; }
.reasons li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 5px; height: 5px; border-radius: 50%; background: var(--ihma-line-2); }
.indep { background: var(--ihma-soft); border-radius: var(--radius-card); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* tarix */
.hist-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 16px 0; border-top: 1px solid var(--ihma-line); }
.hist-item:first-child { border-top: 0; padding-top: 0; }

/* panel */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 880px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; }
.kpi .v { font-size: var(--fs-num); font-weight: 700; color: var(--ihma-navy); line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: var(--fs-h2); color: var(--ihma-muted); font-weight: 600; }
.filters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1.2fr) auto; gap: 8px; align-items: center; }
@media (max-width: 880px) { .filters { grid-template-columns: minmax(0, 1fr); } }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 96px; gap: 12px; align-items: center; }
.bar-track { height: 10px; border-radius: 20px; background: var(--ihma-soft); overflow: hidden; }
.bar-track span { display: block; height: 100%; border-radius: 20px; background: var(--ihma-primary); }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bar-val small { color: var(--ihma-muted); font-weight: 500; }
@media (max-width: 560px) { .bar-row { grid-template-columns: minmax(0, 1fr) 80px; } .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; } }
.table-wrap { overflow-x: auto; border: 1px solid var(--ihma-line); border-radius: var(--radius-card); }
table { width: 100%; border-collapse: collapse; min-width: 980px; }
th { background: var(--ihma-soft); text-align: left; font-size: var(--fs-cap); font-weight: 600; color: var(--ihma-muted); padding: 10px 12px; white-space: nowrap; }
td { padding: 12px; border-top: 1px solid var(--ihma-line); vertical-align: middle; }
tbody tr:hover td { background: var(--ihma-row-hover); }
tbody tr.sel td { background: var(--ihma-soft); }
td.r, th.r { text-align: right; }
td.num, td.case { white-space: nowrap; }
.answer-text { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--ihma-soft); border-radius: var(--radius-ctl); padding: 16px; max-height: 360px; overflow-y: auto; }
.empty { text-align: center; padding: 32px 16px; color: var(--ihma-muted); }

/* javob yuborildi: jarayon belgisi emas, tayyor (✓) belgisi */
.sent-card { text-align: center; align-items: center; }
.sent-mark { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin: 6px auto 2px;
  background: linear-gradient(135deg, var(--ihma-success), var(--ihma-success-dark)); color: #fff;
  box-shadow: 0 0 0 10px var(--ihma-success-soft), 0 10px 24px rgba(31, 157, 58, .28); animation: sent-pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }

@keyframes sent-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes sent-draw { to { stroke-dashoffset: 0; } }

            <div class="stack-8" id="case-text"></div>

            <p id="case-task"></p>

</div>
